name: Release

# Builds the payload and publishes a GitHub Release whenever a version tag
# (v1.2.0, v1.2.1, ...) is pushed. Can also be run by hand from the Actions tab
# to produce a test build (uploaded as a workflow artifact, no release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SDK_VERSION: v0.43
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 unzip

      - name: Install ps5-payload-sdk
        run: |
          curl -fsSL -o sdk.zip \
            "https://github.com/ps5-payload-dev/sdk/releases/download/${SDK_VERSION}/ps5-payload-sdk.zip"
          unzip -q sdk.zip -d "$RUNNER_TEMP"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Build payload
        working-directory: payload
        run: |
          python3 gen_html.py
          make
          sha256sum ghost-control-ps5.elf | tee ghost-control-ps5.elf.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-control-ps5
          path: |
            payload/ghost-control-ps5.elf
            payload/ghost-control-ps5.elf.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            payload/ghost-control-ps5.elf
            payload/ghost-control-ps5.elf.sha256
